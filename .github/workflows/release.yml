name: Release

# Pushing a tag vX.Y (matching versionName) builds signed APKs and publishes
# them as a GitHub release. See publishing/github-releases.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Also validates the checksum of gradle/wrapper/gradle-wrapper.jar.
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches versionName
        run: |
          version=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RUBIFY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret RUBIFY_KEYSTORE_BASE64 is not set; refusing to publish unsigned APKs"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rubify-upload.jks"
          echo "ORG_GRADLE_PROJECT_rubifyKeystoreFile=$RUNNER_TEMP/rubify-upload.jks" >> "$GITHUB_ENV"

      - name: Test, lint and build signed APKs
        env:
          ORG_GRADLE_PROJECT_rubifyKeystorePassword: ${{ secrets.RUBIFY_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_rubifyKeyAlias: ${{ secrets.RUBIFY_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_rubifyKeyPassword: ${{ secrets.RUBIFY_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease -PrubifyAbiSplits=true

      - name: Collect and verify APKs
        run: |
          out=app/build/outputs/apk/release
          if compgen -G "$out/*-unsigned.apk" > /dev/null; then
            echo "::error::Release APKs are unsigned; check the signing secrets"
            exit 1
          fi
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          mkdir dist
          for apk in "$out"/app-*-release.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            "$apksigner" verify "$apk"
            cp "$apk" "dist/rubify-$VERSION-$abi.apk"
          done
          "$apksigner" verify --print-certs "dist/rubify-$VERSION-universal.apk" | grep -i sha-256
          (cd dist && sha256sum -- *.apk > SHA256SUMS.txt)
          ls -l dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Rubify $VERSION" \
            --generate-notes \
            --verify-tag

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/rubify-upload.jks"
